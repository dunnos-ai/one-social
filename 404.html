<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>No encontrado · ONE</title>
<style>
  :root{ --s0:#0C0C10; --s1:#131319; --line:#2E2E39; --bone:#F4F2ED; --t3:#6E6E7C; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--s0);color:var(--bone);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  .caja{max-width:340px;text-align:center;}
  .num{font-size:52px;font-weight:800;letter-spacing:-1px;color:var(--t3);line-height:1;}
  h1{font-size:17px;font-weight:700;margin:14px 0 8px;}
  p{font-size:13.5px;line-height:1.55;color:var(--t3);margin:0 0 22px;}
  a{display:inline-block;padding:12px 22px;border-radius:14px;text-decoration:none;
    font-size:13.5px;font-weight:700;color:var(--bone);
    background:var(--s1);border:1px solid var(--line);}
  a:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="caja">
    <div class="num">404</div>
    <h1>Aquí no hay nada</h1>
    <p>Esta dirección no existe o no está disponible.</p>
    <a href="/">Ir a ONE</a>
  </div>
</body>
</html>
