[build]
  publish   = "."
  functions = "netlify/functions"

# Sin build step: Netlify sirve los archivos tal cual están en el repo.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control          = "no-cache, must-revalidate"
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Los íconos y la mascota sí se cachean: no cambian casi nunca.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/mrpatterson.gif"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# El repo se publica entero (publish = "."), así que TODO archivo que viva aquí
# queda leíble por URL. Estas rutas son código y documentación interna —el prompt
# de Mr. Patterson, los nombres de tablas y funciones, las migraciones— y no
# tienen por qué servirse. Siguen en el repo y en el historial; solo dejan de
# estar en la web. force = true es obligatorio: sin eso el archivo estático gana.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/DESPLIEGUE.md"
  to = "/index.html"
  status = 404
  force = true
