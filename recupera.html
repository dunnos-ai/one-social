<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recupera tu acceso · ONE</title>
<meta name="theme-color" content="#F2EFE6">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Recupera tu acceso">
<meta property="og:description" content="Elige una contraseña nueva y vuelve a entrar a ONE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta clara — la misma de insignias.html y del tema que la app fuerza al arrancar. */
  --ink:#F2EFE6; --s1:#FFFFFF; --s2:#EDEAE0; --line:#E9E4D6;
  --bone:#1C1A14; --t2:#5C5847; --t3:#8A8574;
  --mint:#0E9E75; --mint-d:#07543E; --acid:#C97C05; --iris:#6552E6; --on-mint:#FFFFFF;
  --fd:'Bricolage Grotesque',sans-serif; --fb:'Space Grotesk',sans-serif; --fm:'JetBrains Mono',monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--ink);color:var(--bone);font-family:var(--fb);line-height:1.5;
     -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;}
.wrap{width:100%;max-width:460px;margin:0 auto;padding:28px 20px 40px;flex:1;
      display:flex;flex-direction:column;justify-content:center;}

.mark{width:44px;height:44px;margin-bottom:26px;}
.mark svg{width:100%;height:100%;display:block;}

.eyebrow{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;
         text-transform:uppercase;color:var(--mint);margin-bottom:10px;}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(30px,9vw,42px);
   letter-spacing:-.03em;line-height:1.02;margin-bottom:6px;}
.sub{color:var(--t2);font-size:14.5px;margin-bottom:26px;}

/* cifra principal */
.hero-num{background:linear-gradient(150deg,#E6F5EF,#FFFFFF);border:1px solid rgba(14,158,117,.26);
          border-radius:22px;padding:24px 22px;margin-bottom:12px;position:relative;overflow:hidden;}
.hero-num::after{content:'';position:absolute;top:-70px;right:-70px;width:200px;height:200px;
                 border-radius:50%;background:radial-gradient(closest-side,rgba(14,158,117,.14),transparent 70%);}
.big{font-family:var(--fd);font-weight:800;font-size:64px;line-height:1;color:var(--mint);
     letter-spacing:-.04em;position:relative;}
.big-l{font-size:13.5px;color:var(--t2);margin-top:4px;position:relative;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:15px 16px;}
.stat-v{font-family:var(--fd);font-weight:700;font-size:25px;letter-spacing:-.02em;}
.stat-l{font-size:11.5px;color:var(--t3);margin-top:2px;}

/* insignias */
.badges{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:17px 18px;margin-bottom:22px;}
.badges-h{font-family:var(--fm);font-size:10.5px;font-weight:700;letter-spacing:.14em;
          text-transform:uppercase;color:var(--acid);margin-bottom:11px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:rgba(201,124,5,.09);border:1px solid rgba(201,124,5,.3);color:var(--acid);
      border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;}

.cta{display:block;width:100%;background:var(--mint);color:var(--on-mint);border:none;
     border-radius:16px;padding:17px;font-family:var(--fb);font-weight:700;font-size:16.5px;
     text-align:center;text-decoration:none;cursor:pointer;
     box-shadow:0 10px 28px rgba(14,158,117,.24);}
.cta:active{transform:translateY(1px);}
.cta-note{text-align:center;color:var(--t3);font-size:12.5px;margin-top:13px;}

.msg{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:30px 24px;text-align:center;}
.msg h2{font-family:var(--fd);font-weight:700;font-size:21px;margin-bottom:8px;letter-spacing:-.02em;}
.msg p{color:var(--t2);font-size:14px;margin-bottom:20px;}
.link{color:var(--mint);text-decoration:none;font-weight:600;}
.skel{height:15px;border-radius:7px;background:linear-gradient(90deg,var(--s2),#F7F5EE,var(--s2));
      background-size:200% 100%;animation:sh 1.3s linear infinite;margin-bottom:9px;}
@keyframes sh{to{background-position:-200% 0}}

/* formulario de contraseña */
.campo{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;}
.campo-l{font-family:var(--fm);font-size:10.5px;font-weight:700;letter-spacing:.14em;
         text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.campo input{width:100%;border:none;background:none;font-family:var(--fb);font-size:16px;
             color:var(--bone);outline:none;}
.usuario{background:rgba(14,158,117,.08);border:1px solid rgba(14,158,117,.3);border-radius:16px;
         padding:14px 16px;margin-bottom:18px;}
.usuario-v{font-family:var(--fm);font-weight:700;font-size:19px;color:var(--mint-d);
           letter-spacing:-.01em;word-break:break-all;}
.err{color:#C0392B;font-size:13px;margin:-2px 0 12px;min-height:18px;}
.cta[disabled]{opacity:.55;box-shadow:none;cursor:default;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="mark"><svg viewBox="0 0 116 116" aria-label="ONE"><g transform="translate(8,8)"><path d="M68 22 A30 30 0 1 0 78 45 L78 86" fill="none" stroke="#0E9E75" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>
  <div class="skel" style="width:45%"></div>
  <div class="skel" style="width:80%;height:30px"></div>
  <div class="skel" style="width:65%"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://otlcrsnoeosyscwhjfxr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KvYJyZdCwYEyqpiVGDc1lQ_2seVt7YO';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:false } });

const MARK = `<div class="mark"><svg viewBox="0 0 116 116" aria-label="ONE"><g transform="translate(8,8)"><path d="M68 22 A30 30 0 1 0 78 45 L78 86" fill="none" stroke="#0E9E75" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></g></svg></div>`;
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const primerNombre = n => {
  const p = String(n||'').trim().split(/\s+/)[0] || '';
  return p.charAt(0) + p.slice(1).toLowerCase();
};
const app = document.getElementById('app');
const pintar = html => { app.innerHTML = MARK + html; };
const TOKEN = new URLSearchParams(location.search).get('t');

function pantallaGenerica(titulo, texto){
  pintar(`<div class="msg"><h2>${esc(titulo)}</h2><p>${esc(texto)}</p>
    <a class="cta" href="index.html">Abrir ONE</a></div>`);
}

// Los motivos se traducen a algo accionable: en los tres casos lo que toca es pedirle
// otra liga a su líder, y eso es lo que dice la pantalla.
const MOTIVO = {
  inexistente: 'Esta liga no existe o ya fue reemplazada por una más nueva.',
  usada:       'Esta liga ya se usó. Cada una sirve una sola vez.',
  vencida:     'Esta liga venció. Duran 24 horas.'
};

async function guardar(){
  const btn  = document.getElementById('btnGuardar');
  const err  = document.getElementById('err');
  const p1   = document.getElementById('p1').value;
  const p2   = document.getElementById('p2').value;
  err.textContent = '';
  if(!p1 || p1.length < 4){ err.textContent = 'La contraseña debe tener al menos 4 caracteres.'; return; }
  if(p1 !== p2){ err.textContent = 'Las dos contraseñas no coinciden.'; return; }

  btn.disabled = true; btn.textContent = 'Guardando…';
  const { data, error } = await sb.rpc('recuperar_con_token', { p_token: TOKEN, p_password: p1 });
  if(error){
    err.textContent = error.message || 'No se pudo guardar. Intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Guardar y entrar';
    return;
  }
  const d = (data||[])[0] || {};

  // Entrar de una vez, para que no tenga que teclear nada más. Si algo falla aquí,
  // la contraseña YA quedó guardada: se le manda a la pantalla de entrar, no a un error.
  try{
    const { error: errLogin } = await sb.auth.signInWithPassword({ email: d.correo, password: p1 });
    if(!errLogin){ location.href = 'index.html'; return; }
  }catch(e){ /* cae al mensaje de abajo */ }

  pintar(`<div class="msg"><h2>Contraseña guardada</h2>
    <p>Entra con tu usuario <b>${esc(d.username)}</b> y tu contraseña nueva.</p>
    <a class="cta" href="index.html">Entrar a ONE</a></div>`);
}

async function arranca(){
  if(!TOKEN){
    pantallaGenerica('Liga incompleta', 'Pídele a tu líder que te reenvíe tu liga de acceso.');
    return;
  }
  const { data, error } = await sb.rpc('recuperacion_por_token', { p_token: TOKEN });
  if(error){
    pantallaGenerica('No pudimos abrir tu liga', 'Revisa tu conexión e intenta de nuevo.');
    return;
  }
  const d = (data||[])[0];
  if(!d || !d.valida){
    const quien = d && d.nombre ? primerNombre(d.nombre) : null;
    pintar(`<div class="msg"><h2>${quien ? 'Hola, '+esc(quien) : 'Esta liga ya no sirve'}</h2>
      <p>${esc((d && MOTIVO[d.motivo]) || MOTIVO.inexistente)} Pídele a tu líder que te mande una nueva.</p>
      <a class="cta" href="index.html">Abrir ONE</a></div>`);
    return;
  }

  pintar(`
    <div class="eyebrow">Zona Uno · recupera tu acceso</div>
    <h1>Hola, ${esc(primerNombre(d.nombre))}.</h1>
    <div class="sub">Elige una contraseña nueva. Tu historial y tus insignias siguen intactos.</div>

    <div class="usuario">
      <div class="campo-l">Tu usuario es</div>
      <div class="usuario-v">${esc(d.username)}</div>
    </div>

    <div class="campo">
      <div class="campo-l">Contraseña nueva</div>
      <input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 4 caracteres">
    </div>
    <div class="campo">
      <div class="campo-l">Repítela</div>
      <input id="p2" type="password" autocomplete="new-password" placeholder="La misma otra vez">
    </div>
    <div class="err" id="err"></div>

    <button class="cta" id="btnGuardar">Guardar y entrar</button>
    <div class="cta-note">Esta liga sirve una sola vez y vive 24 horas.</div>
  `);
  document.getElementById('btnGuardar').addEventListener('click', guardar);
  document.getElementById('p2').addEventListener('keydown', e => { if(e.key==='Enter') guardar(); });
}
arranca();
</script>
</body>
</html>
